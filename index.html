<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Đầu Tiên Của Tôi</title>
    <style>
        /* CSS cơ bản giúp trang web trông đẹp hơn */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-align: center;
            border-radius: 5px;
        }
        .container {
            background: white;
            padding: 20px;
            margin-top: 15px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <!-- Phần đầu trang -->
    <header>
        <h1>Chào Mừng Đến Với Trang Web Của Tôi</h1>
    </header>

    <!-- Phần nội dung chính -->
    <div class="container">
        <h2>Giới thiệu</h2>
        <p>Đây là một trang web đơn giản được tạo bằng <strong>HTML</strong> và một chút <em>CSS</em>.</p>

        <h2>Danh sách công việc hôm nay:</h2>
        <ul>
            <li>Học HTML/CSS</li>
            <li>Đọc sách</li>
            <li>Tập thể dục</li>
        </ul>

        <h2>Liên kết hữu ích</h2>
        <p>Ghé thăm <a href="https://www.google.com" target="_blank">Google</a> để tìm kiếm thêm thông tin.</p>

        <h2>Tương tác đơn giản</h2>
        <button onclick="alert('Chào bạn! Cảm ơn bạn đã nhấn nút!')">Nhấn vào đây!</button>
    </div>

</body>
</html>
